<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星渲 · Markdown 渲染台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/* ============ 设计令牌 ============ */
:root{
  --font-ui: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --font-serif: Georgia,"Songti SC","Noto Serif SC","SimSun",serif;
  --font-mono: ui-monospace,"JetBrains Mono","SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --radius: 12px;
}
/* —— 夜间:宇宙 × Dracula —— */
[data-theme="dark"]{
  --bg: #0b0d1d;
  --bg-glow-1: rgba(98,72,180,.22);
  --bg-glow-2: rgba(33,90,140,.18);
  --panel: rgba(22,24,44,.72);
  --panel-solid: #181a33;
  --editor-bg: rgba(13,15,32,.65);
  --text: #f8f8f2;
  --text-soft: #b8bce0;
  --muted: #6272a4;
  --accent: #bd93f9;
  --accent-2: #ff79c6;
  --accent-3: #8be9fd;
  --border: rgba(189,147,249,.20);
  --border-soft: rgba(189,147,249,.10);
  --code-bg: #282a36;          /* Dracula */
  --code-fg: #f8f8f2;
  --inline-code-bg: rgba(189,147,249,.14);
  --inline-code-fg: #ff79c6;
  --quote-bg: rgba(139,233,253,.06);
  --table-stripe: rgba(189,147,249,.05);
  --btn-bg: rgba(189,147,249,.10);
  --btn-bg-hover: rgba(189,147,249,.22);
  --btn-active-bg: #bd93f9;
  --btn-active-fg: #15172e;
  --shadow: 0 8px 32px rgba(0,0,0,.45);
  --scrollbar: rgba(189,147,249,.25);
  color-scheme: dark;
}
/* —— 日间:Catppuccin Latte —— */
[data-theme="light"]{
  --bg: #eff1f5;
  --bg-glow-1: rgba(136,57,239,.07);
  --bg-glow-2: rgba(30,102,245,.06);
  --panel: rgba(255,255,255,.78);
  --panel-solid: #ffffff;
  --editor-bg: rgba(230,233,239,.55);
  --text: #4c4f69;
  --text-soft: #5c5f77;
  --muted: #8c8fa1;
  --accent: #8839ef;
  --accent-2: #ea76cb;
  --accent-3: #1e66f5;
  --border: #ccd0da;
  --border-soft: #dce0e8;
  --code-bg: #e6e9ef;
  --code-fg: #4c4f69;
  --inline-code-bg: rgba(136,57,239,.10);
  --inline-code-fg: #8839ef;
  --quote-bg: rgba(30,102,245,.05);
  --table-stripe: rgba(108,111,133,.05);
  --btn-bg: rgba(136,57,239,.08);
  --btn-bg-hover: rgba(136,57,239,.16);
  --btn-active-bg: #8839ef;
  --btn-active-fg: #ffffff;
  --shadow: 0 8px 24px rgba(76,79,105,.10);
  --scrollbar: rgba(136,57,239,.25);
  color-scheme: light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font-ui); color:var(--text);
  background:var(--bg);
  background-image: radial-gradient(ellipse 80% 60% at 15% -10%, var(--bg-glow-1), transparent 60%),
                    radial-gradient(ellipse 70% 55% at 95% 110%, var(--bg-glow-2), transparent 60%);
  background-attachment: fixed;
  transition: background-color .4s, color .4s;
  display:flex; flex-direction:column; overflow:hidden;
}

/* ============ 星空(仅夜间) ============ */
#sky{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
[data-theme="light"] #sky{display:none}
.star{position:absolute; background:#fff; border-radius:50%; opacity:.7;
  animation: twinkle var(--d,3s) ease-in-out var(--delay,0s) infinite alternate}
@keyframes twinkle{ from{opacity:.15; transform:scale(.8)} to{opacity:.9; transform:scale(1.15)} }
.meteor{position:absolute; width:3px; height:3px; border-radius:50%; background:#fff;
  box-shadow:0 0 8px 2px rgba(255,255,255,.7);
  animation: shoot var(--t,1.4s) linear forwards}
.meteor::after{content:""; position:absolute; top:50%; left:2px; transform:translateY(-50%);
  width:140px; height:1.5px;
  background:linear-gradient(90deg, rgba(189,147,249,.9), rgba(139,233,253,.4), transparent)}
@keyframes shoot{
  0%{ transform: rotate(210deg) translateX(0); opacity:0 }
  8%{ opacity:1 }
  85%{ opacity:1 }
  100%{ transform: rotate(210deg) translateX(-72vw); opacity:0 }
}
@media (prefers-reduced-motion: reduce){
  .star,.meteor{animation:none}
  .meteor{display:none}
}

/* ============ 顶栏 ============ */
header{
  position:relative; z-index:5;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 18px;
  background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.brand h1{font-size:18px; margin:0; letter-spacing:.06em; font-weight:700}
.brand h1 .glyph{color:var(--accent); margin-right:6px}
.brand .sub{font-size:12px; color:var(--muted); letter-spacing:.12em}

.seg{display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; background:var(--btn-bg)}
.seg button{
  appearance:none; border:0; background:transparent; color:var(--text-soft);
  font-family:var(--font-ui); font-size:13px; padding:7px 15px; cursor:pointer;
  transition:background .2s, color .2s;
}
.seg button:hover{background:var(--btn-bg-hover)}
.seg button.on{background:var(--btn-active-bg); color:var(--btn-active-fg); font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

.btn{
  appearance:none; border:1px solid var(--border); border-radius:999px;
  background:var(--btn-bg); color:var(--text); font-family:var(--font-ui);
  font-size:13px; padding:7px 14px; cursor:pointer; transition:background .2s, transform .1s;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{background:var(--btn-bg-hover)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.on{background:var(--btn-active-bg); color:var(--btn-active-fg)}
.btn .ic{font-size:14px; line-height:1}

/* ============ 弹出面板 ============ */
.pop{
  position:fixed; z-index:30; top:58px; right:18px; width:320px; max-width:calc(100vw - 24px);
  max-height:calc(100vh - 80px); overflow:auto;
  background:var(--panel-solid); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); padding:14px 16px; display:none;
}
.pop.open{display:block; animation:popin .18s ease}
@keyframes popin{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
.pop h3{margin:2px 0 12px; font-size:13px; letter-spacing:.18em; color:var(--muted); font-weight:600}
.pop h3 .glyph{color:var(--accent); margin-right:6px}

.set-row{margin:0 0 13px}
.set-row .lab{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-soft); margin-bottom:5px}
.set-row .val{color:var(--accent); font-family:var(--font-mono); font-size:12px}
input[type=range]{
  width:100%; appearance:none; -webkit-appearance:none; height:4px; border-radius:2px;
  background:var(--border); outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none; -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
  background:var(--accent); border:2px solid var(--panel-solid); box-shadow:0 1px 4px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-thumb{
  width:13px; height:13px; border-radius:50%; background:var(--accent);
  border:2px solid var(--panel-solid);
}
.chip-row{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  appearance:none; border:1px solid var(--border); background:var(--btn-bg); color:var(--text-soft);
  border-radius:8px; padding:5px 12px; font-size:12.5px; cursor:pointer; font-family:var(--font-ui);
  transition:background .15s, color .15s;
}
.chip:hover{background:var(--btn-bg-hover)}
.chip.on{background:var(--btn-active-bg); color:var(--btn-active-fg); border-color:transparent}
.pop .foot{display:flex; justify-content:flex-end; gap:8px; margin-top:4px}
.menu{padding:6px}
.menu button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  appearance:none; border:0; background:transparent; color:var(--text);
  font-family:var(--font-ui); font-size:13.5px; padding:9px 12px; border-radius:8px; cursor:pointer;
}
.menu button:hover{background:var(--btn-bg-hover)}
.menu button .ic{width:18px; text-align:center; color:var(--accent)}
.menu .sep{height:1px; background:var(--border-soft); margin:5px 8px}

/* ============ 主区域 + 可拖拽分屏 ============ */
main{
  position:relative; z-index:1; flex:1; min-height:0;
  display:grid; gap:0; padding:14px 18px 18px;
  grid-template-columns: minmax(240px, var(--lw, 1fr)) 14px minmax(240px, var(--rw, 1fr));
}
.resizer{
  cursor:col-resize; position:relative; touch-action:none; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
}
.resizer::before{
  content:""; width:4px; height:44px; border-radius:2px;
  background:var(--border); transition:background .2s, height .2s;
}
.resizer:hover::before, .resizer.dragging::before{background:var(--accent); height:70px}
body.resizing{cursor:col-resize; user-select:none}
body.resizing iframe{pointer-events:none}

body[data-view="edit"] main{grid-template-columns:1fr}
body[data-view="edit"] #previewPane, body[data-view="edit"] .resizer{display:none}
body[data-view="preview"] main{grid-template-columns:1fr}
body[data-view="preview"] #editorPane, body[data-view="preview"] .resizer{display:none}

.pane{
  display:flex; flex-direction:column; min-height:0; min-width:0;
  background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; position:relative;
}
.pane-head{
  display:flex; align-items:center; gap:8px;
  padding:6px 12px; font-size:12px; color:var(--muted); letter-spacing:.05em;
  border-bottom:1px solid var(--border-soft); flex:none; flex-wrap:wrap;
}
.pane-head .title{letter-spacing:.14em; margin-right:auto; white-space:nowrap}
.pane-head .dot{color:var(--accent)}
.pane-head .stat{font-family:var(--font-mono); font-size:11px; white-space:nowrap}

/* 编辑工具栏 */
.tbar{display:flex; gap:2px; flex-wrap:wrap}
.tbar button{
  appearance:none; border:0; background:transparent; color:var(--text-soft);
  width:28px; height:26px; border-radius:6px; cursor:pointer; font-size:13px;
  font-family:var(--font-mono); display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
}
.tbar button:hover{background:var(--btn-bg-hover); color:var(--text)}
.tbar .gap{width:8px}
.sync-toggle{display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-size:11.5px; white-space:nowrap; user-select:none}
.sync-toggle input{accent-color:var(--accent); cursor:pointer; margin:0}

#editor{
  flex:1; min-height:0; width:100%; resize:none; border:0; outline:0;
  background:var(--editor-bg); color:var(--text);
  font-family:var(--font-mono); font-size:14px; line-height:1.75;
  padding:18px 20px; tab-size:2;
}
#editor::placeholder{color:var(--muted)}
#editor::selection{background:var(--accent); color:var(--btn-active-fg)}
#editor.dragover{outline:2px dashed var(--accent); outline-offset:-6px}

#preview{
  flex:1; min-height:0; overflow:auto; padding:24px 30px 48px; background:transparent;
  scroll-behavior:auto;
}

/* 目录面板 */
#tocPanel{
  position:absolute; top:38px; right:10px; bottom:10px; width:230px; z-index:8;
  background:var(--panel-solid); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow); padding:12px 6px 12px 14px; overflow:auto;
  display:none;
}
#tocPanel.open{display:block; animation:popin .18s ease}
#tocPanel .toc-title{font-size:12px; letter-spacing:.18em; color:var(--muted); margin:0 0 10px}
#tocPanel a{
  display:block; color:var(--text-soft); text-decoration:none; font-size:13px;
  padding:4px 8px; border-radius:6px; line-height:1.45;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
#tocPanel a:hover{background:var(--btn-bg-hover); color:var(--text)}
#tocPanel a.lv2{padding-left:20px}
#tocPanel a.lv3{padding-left:34px; font-size:12.5px}
#tocPanel .toc-empty{color:var(--muted); font-size:12.5px; padding:6px 8px}

::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:var(--scrollbar); border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ============ Markdown 排版(由排版面板控制的变量) ============ */
.md{
  font-size:var(--md-fs, 15.5px);
  line-height:var(--md-lh, 1.85);
  max-width:var(--md-w, 860px);
  letter-spacing:var(--md-ls, 0em);
  filter:brightness(var(--md-dim, 1));
  color:var(--text); word-wrap:break-word; margin:0 auto;
}
#preview[data-font="serif"] .md{font-family:var(--font-serif)}
#preview[data-font="mono"] .md{font-family:var(--font-mono)}
#preview[data-align="justify"] .md p{text-align:justify}
.md>:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{font-weight:700; line-height:1.4; margin:1.6em 0 .7em; scroll-margin-top:12px}
.md h1{font-size:1.9em; padding-bottom:.35em; border-bottom:1px solid var(--border)}
.md h2{font-size:1.5em; padding-bottom:.3em; border-bottom:1px solid var(--border-soft)}
.md h3{font-size:1.22em}
.md h1::before,.md h2::before{content:"✦"; color:var(--accent); font-size:.65em; margin-right:.55em; vertical-align:.25em}
.md p{margin:var(--md-para, .85em) 0}
.md a{color:var(--accent-3); text-decoration:none; border-bottom:1px dashed var(--accent-3)}
.md a:hover{border-bottom-style:solid}
.md strong{color:var(--accent-2)}
.md ul,.md ol{padding-left:1.6em; margin:.85em 0}
.md li{margin:.3em 0}
.md li::marker{color:var(--accent)}
.md blockquote{
  margin:1em 0; padding:.6em 1.2em; border-left:3px solid var(--accent);
  background:var(--quote-bg); border-radius:0 8px 8px 0; color:var(--text-soft);
}
.md hr{border:0; height:1px; margin:2em auto; width:60%;
  background:linear-gradient(90deg, transparent, var(--accent), transparent)}
.md img{max-width:100%; border-radius:8px; box-shadow:0 4px 18px rgba(0,0,0,.18)}
.md table{border-collapse:collapse; margin:1.2em 0; width:100%; font-size:.95em}
.md th,.md td{border:1px solid var(--border); padding:.55em .9em; text-align:left}
.md th{background:var(--inline-code-bg)}
.md tr:nth-child(even) td{background:var(--table-stripe)}
.md code:not(pre code){
  font-family:var(--font-mono); font-size:.88em;
  background:var(--inline-code-bg); color:var(--inline-code-fg);
  padding:.18em .45em; border-radius:6px;
}
.md pre{
  background:var(--code-bg); color:var(--code-fg);
  border:1px solid var(--border-soft); border-radius:10px;
  padding:16px 18px; overflow:auto; margin:1.2em 0;
  font-size:calc(var(--md-fs, 15.5px) * .87); line-height:1.7;
}
.md pre code{font-family:var(--font-mono); background:transparent; padding:0}
.md .katex{font-size:1.08em}
.md .katex-display{overflow-x:auto; overflow-y:hidden; padding:.3em 0}
.math-error{color:#ff5555; font-family:var(--font-mono); font-size:.9em;
  background:rgba(255,85,85,.1); padding:.1em .4em; border-radius:4px}
.empty-hint{color:var(--muted); text-align:center; margin-top:18vh; letter-spacing:.2em; font-size:14px}

/* ============ 代码高亮 · 夜间 Dracula ============ */
[data-theme="dark"] .hljs{color:#f8f8f2}
[data-theme="dark"] .hljs-comment,[data-theme="dark"] .hljs-quote{color:#6272a4}
[data-theme="dark"] .hljs-keyword,[data-theme="dark"] .hljs-selector-tag,[data-theme="dark"] .hljs-tag,[data-theme="dark"] .hljs-section{color:#ff79c6}
[data-theme="dark"] .hljs-string,[data-theme="dark"] .hljs-regexp,[data-theme="dark"] .hljs-addition{color:#f1fa8c}
[data-theme="dark"] .hljs-number,[data-theme="dark"] .hljs-literal,[data-theme="dark"] .hljs-symbol{color:#bd93f9}
[data-theme="dark"] .hljs-title,[data-theme="dark"] .hljs-title.function_,[data-theme="dark"] .hljs-name{color:#50fa7b}
[data-theme="dark"] .hljs-built_in,[data-theme="dark"] .hljs-type,[data-theme="dark"] .hljs-class .hljs-title,[data-theme="dark"] .hljs-title.class_{color:#8be9fd; font-style:italic}
[data-theme="dark"] .hljs-attr,[data-theme="dark"] .hljs-attribute,[data-theme="dark"] .hljs-variable,[data-theme="dark"] .hljs-params,[data-theme="dark"] .hljs-template-variable{color:#ffb86c}
[data-theme="dark"] .hljs-meta,[data-theme="dark"] .hljs-link{color:#8be9fd}
[data-theme="dark"] .hljs-deletion{color:#ff5555}
[data-theme="dark"] .hljs-emphasis{font-style:italic}
[data-theme="dark"] .hljs-strong{font-weight:bold}

/* ============ 代码高亮 · 日间 Catppuccin Latte ============ */
[data-theme="light"] .hljs{color:#4c4f69}
[data-theme="light"] .hljs-comment,[data-theme="light"] .hljs-quote{color:#9ca0b0}
[data-theme="light"] .hljs-keyword,[data-theme="light"] .hljs-selector-tag,[data-theme="light"] .hljs-section{color:#8839ef}
[data-theme="light"] .hljs-string,[data-theme="light"] .hljs-addition{color:#40a02b}
[data-theme="light"] .hljs-regexp,[data-theme="light"] .hljs-link{color:#179299}
[data-theme="light"] .hljs-number,[data-theme="light"] .hljs-literal,[data-theme="light"] .hljs-symbol{color:#fe640b}
[data-theme="light"] .hljs-title,[data-theme="light"] .hljs-title.function_,[data-theme="light"] .hljs-name{color:#1e66f5}
[data-theme="light"] .hljs-built_in,[data-theme="light"] .hljs-type,[data-theme="light"] .hljs-title.class_{color:#df8e1d; font-style:italic}
[data-theme="light"] .hljs-attr,[data-theme="light"] .hljs-attribute,[data-theme="light"] .hljs-variable,[data-theme="light"] .hljs-params,[data-theme="light"] .hljs-template-variable{color:#e64553}
[data-theme="light"] .hljs-meta,[data-theme="light"] .hljs-tag{color:#7287fd}
[data-theme="light"] .hljs-deletion{color:#d20f39}
[data-theme="light"] .hljs-emphasis{font-style:italic}
[data-theme="light"] .hljs-strong{font-weight:bold}

/* ============ 提示气泡 ============ */
#toast{
  position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
  z-index:40; background:var(--panel-solid); color:var(--text);
  border:1px solid var(--accent); border-radius:999px;
  padding:9px 22px; font-size:13px; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ============ 打印 / 导出 PDF ============ */
@media print{
  body{display:block; overflow:visible; background:#fff !important; background-image:none !important}
  header, #sky, .resizer, #editorPane, #toast, .pop, #tocPanel{display:none !important}
  main{display:block; padding:0}
  .pane{border:0; box-shadow:none; background:#fff; backdrop-filter:none; overflow:visible}
  #previewPane{display:block !important}
  .pane-head{display:none}
  #preview{overflow:visible; padding:0}
  .md{filter:none; color:#1a1a2e}
  .md a{color:#1e66f5}
}

/* ============ 响应式 ============ */
@media (max-width: 820px){
  main{grid-template-columns:1fr !important; grid-template-rows:1fr 1fr; gap:12px}
  .resizer{display:none}
  body[data-view="edit"] main, body[data-view="preview"] main{grid-template-rows:1fr}
  header{padding:8px 10px; gap:6px}
  .brand .sub{display:none}
  #preview{padding:18px 16px 40px}
  #tocPanel{width:78%}
}
</style>
</head>
<body data-view="split">

<div id="sky" aria-hidden="true"></div>

<header>
  <div class="brand">
    <h1><span class="glyph">✦</span>星渲</h1>
    <span class="sub">MARKDOWN 渲染台</span>
  </div>

  <div class="seg" role="group" aria-label="视图切换">
    <button id="vEdit" type="button">编辑</button>
    <button id="vSplit" type="button" class="on">分屏</button>
    <button id="vPreview" type="button">渲染</button>
  </div>

  <button class="btn" id="mathBtn" type="button" title="把 \( \) 转为 $ $,\[ \] 转为 $$ $$(自动跳过代码块)"><span class="ic">∫</span>数学转换</button>
  <button class="btn" id="tocBtn" type="button" title="按标题生成目录,点击跳转"><span class="ic">☰</span>目录</button>

<div id="toast" role="status"></div>

<script>
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const editor = $('#editor'), preview = $('#preview'), mdRoot = $('#mdRoot');
const stat = $('#stat'), readStat = $('#readStat'), toastEl = $('#toast');
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function download(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ================= 主题:夜间 / 日间 / 跟随系统 ================= */
const MODES = ['dark','light','system'];
const MODE_LABEL = { dark:'🌙 夜间', light:'☀️ 日间', system:'🖥️ 跟随系统' };
let themeMode = 'system';
const mq = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const actual = themeMode === 'system' ? (mq.matches ? 'dark' : 'light') : themeMode;
  document.documentElement.setAttribute('data-theme', actual);
  $('#themeBtn').textContent = MODE_LABEL[themeMode];
  syncSky();
}
mq.addEventListener('change', ()=>{ if(themeMode==='system') applyTheme(); });
$('#themeBtn').addEventListener('click', ()=>{
  themeMode = MODES[(MODES.indexOf(themeMode)+1) % MODES.length];
  applyTheme();
  toast('主题:' + MODE_LABEL[themeMode]);
});

/* ================= 星空与流星(仅夜间) ================= */
const sky = $('#sky');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let meteorTimer = null;
function buildStars(){
  if (sky.dataset.built) return;
  sky.dataset.built = '1';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 130; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.6;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--d:${(Math.random()*3+2).toFixed(1)}s;--delay:${(Math.random()*4).toFixed(1)}s`;
    frag.appendChild(s);
  }
  sky.appendChild(frag);
}
function spawnMeteor(){
  const m = document.createElement('div');
  m.className = 'meteor';
  m.style.left = (20 + Math.random()*75) + '%';
  m.style.top  = (Math.random()*45) + '%';
  m.style.setProperty('--t', (1 + Math.random()*0.9).toFixed(2) + 's');
  sky.appendChild(m);
  m.addEventListener('animationend', ()=> m.remove());
}
function scheduleMeteor(){
  meteorTimer = setTimeout(()=>{
    if (document.documentElement.getAttribute('data-theme') === 'dark') spawnMeteor();
    scheduleMeteor();
  }, 2500 + Math.random()*5000);
}
function syncSky(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark){
    buildStars();
    if (!reducedMotion && meteorTimer === null) scheduleMeteor();
  } else if (meteorTimer !== null){
    clearTimeout(meteorTimer); meteorTimer = null;
  }
}

/* ================= 数学语法处理 ================= */
const CODE_SPLIT_RE = /(```[\s\S]*?(?:```|$)|~~~[\s\S]*?(?:~~~|$)|`[^`\n]+`)/g;
function mapOutsideCode(text, fn){
  return text.split(CODE_SPLIT_RE).map((seg, i) => (i % 2 === 1) ? seg : fn(seg)).join('');
}
function convertMathDelimiters(text){
  let count = 0;
  const out = mapOutsideCode(text, seg =>
    seg
      .replace(/\\\[([\s\S]*?)\\\]/g, (m, t) => { count++; return '$$' + t + '$$'; })
      .replace(/\\\(([\s\S]*?)\\\)/g, (m, t) => { count++; return '$' + t.trim() + '$'; })
  );
  return { out, count };
}
function extractMath(text, store){
  const grab = (display) => (m, tex) => {
    store.push({ tex, display });
    return `§§MATH${store.length - 1}§§`;
  };
  return mapOutsideCode(text, seg =>
    seg
      .replace(/(?<!\\)\$\$([\s\S]+?)\$\$/g, grab(true))
      .replace(/\\\[([\s\S]*?)\\\]/g, grab(true))
      .replace(/\\\(([\s\S]*?)\\\)/g, grab(false))
      .replace(/(?<![\\$])\$(?!\$)([^$\n]+?)(?<!\\)\$(?!\$)/g, grab(false))
  );
}
function restoreMath(html, store){
  return html.replace(/§§MATH(\d+)§§/g, (m, i) => {
    const item = store[+i];
    if (!item) return m;
    try {
      return katex.renderToString(item.tex.trim(), {
        displayMode: item.display, throwOnError: true, strict: false
      });
    } catch(e){
      const esc = item.tex.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<span class="math-error" title="${(e.message||'公式错误').replace(/"/g,'&quot;')}">公式错误: ${esc}</span>`;
    }
  });
}

/* ================= Markdown 渲染管线 ================= */
marked.setOptions({ gfm: true, breaks: true });

function updateStats(src){
  const lines = src ? src.split(/\n/).length : 0;
  const cjk = (src.match(/[\u4e00-\u9fff]/g) || []).length;
  const words = (src.replace(/[\u4e00-\u9fff]/g, ' ').match(/[A-Za-z0-9_]+/g) || []).length;
  const total = cjk + words;
  stat.textContent = src ? `${total} 字 · ${lines} 行` : '';
  const mins = Math.max(1, Math.round(total / 400));
  readStat.textContent = total ? `约 ${mins} 分钟读完` : '';
}

function render(){
  const src = editor.value;
  updateStats(src);
  if (!src.trim()){
    mdRoot.innerHTML = '<p class="empty-hint">✦ &nbsp;此处空无一物,唯有星光&nbsp; ✦</p>';
    buildToc();
    return;
  }
  const store = [];
  const prepared = extractMath(src, store);
  let html;
  try { html = marked.parse(prepared); }
  catch(e){ html = '<p class="math-error">Markdown 解析失败:' + e.message + '</p>'; }
  mdRoot.innerHTML = restoreMath(html, store);
  mdRoot.querySelectorAll('pre code').forEach(block => {
    try { hljs.highlightElement(block); } catch(e){}
  });
  buildToc();
}

let renderTimer;
editor.addEventListener('input', ()=>{
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 180);
});

/* ================= 目录(TOC) ================= */
const tocPanel = $('#tocPanel'), tocList = $('#tocList');
function buildToc(){
  const hs = mdRoot.querySelectorAll('h1, h2, h3');
  tocList.innerHTML = '';
  if (!hs.length){
    tocList.innerHTML = '<p class="toc-empty">暂无标题。使用 #、## 创建标题后,这里会自动生成目录。</p>';
    return;
  }
  hs.forEach((h, i) => {
    h.id = 'h-' + i;
    const a = document.createElement('a');
    a.href = '#h-' + i;
    a.textContent = h.textContent;
    a.title = h.textContent;
    a.className = 'lv' + h.tagName[1];
    a.addEventListener('click', e => {
      e.preventDefault();
      h.scrollIntoView({ behavior:'smooth', block:'start' });
    });
    tocList.appendChild(a);
  });
}
$('#tocBtn').addEventListener('click', ()=>{
  const open = tocPanel.classList.toggle('open');
  $('#tocBtn').classList.toggle('on', open);
  if (open && document.body.getAttribute('data-view') === 'edit') setView('split');
});

/* ================= 可拖拽分屏 ================= */
const mainEl = document.querySelector('main');
const resizer = $('#resizer');
let dragging = false;
function setSplit(pct){
  pct = Math.min(0.8, Math.max(0.2, pct));
  mainEl.style.setProperty('--lw', pct + 'fr');
  mainEl.style.setProperty('--rw', (1 - pct) + 'fr');
}
resizer.addEventListener('pointerdown', e => {
  dragging = true;
  resizer.classList.add('dragging');
  document.body.classList.add('resizing');
  resizer.setPointerCapture(e.pointerId);
});
resizer.addEventListener('pointermove', e => {
  if (!dragging) return;
  const r = mainEl.getBoundingClientRect();
  setSplit((e.clientX - r.left) / r.width);
});
function endDrag(){
  dragging = false;
  resizer.classList.remove('dragging');
  document.body.classList.remove('resizing');
}
resizer.addEventListener('pointerup', endDrag);
resizer.addEventListener('pointercancel', endDrag);
resizer.addEventListener('dblclick', ()=>{ setSplit(0.5); toast('已恢复 1:1 分屏'); });

/* ================= 同步滚动 ================= */
const syncChk = $('#syncChk');
const syncIgnore = { e:false, p:false };
function ratioOf(el){
  const max = el.scrollHeight - el.clientHeight;
  return max > 0 ? el.scrollTop / max : 0;
}
function applyRatio(el, r){
  el.scrollTop = r * (el.scrollHeight - el.clientHeight);
}
function bindSync(src, dst, srcKey, dstKey){
  src.addEventListener('scroll', ()=>{
    if (!syncChk.checked) return;
    if (syncIgnore[srcKey]){ syncIgnore[srcKey] = false; return; }
    syncIgnore[dstKey] = true;
    applyRatio(dst, ratioOf(src));
    setTimeout(()=>{ syncIgnore[dstKey] = false; }, 120);
  }, { passive:true });
}
bindSync(editor, preview, 'e', 'p');
bindSync(preview, editor, 'p', 'e');

/* ================= 视图切换 ================= */
const viewBtns = { edit: $('#vEdit'), split: $('#vSplit'), preview: $('#vPreview') };
function setView(v){
  document.body.setAttribute('data-view', v);
  Object.entries(viewBtns).forEach(([k, b]) => b.classList.toggle('on', k === v));
  if (v !== 'edit') render();
}
viewBtns.edit.addEventListener('click', ()=> setView('edit'));
viewBtns.split.addEventListener('click', ()=> setView('split'));
viewBtns.preview.addEventListener('click', ()=> setView('preview'));

/* ================= 排版设置 ================= */
const SETTINGS = [
  { key:'--md-fs',   label:'字号',     min:12,  max:24,  step:0.5,  def:15.5, unit:'px' },
  { key:'--md-lh',   label:'行间距',   min:1.3, max:2.6, step:0.05, def:1.85, unit:'' },
  { key:'--md-w',    label:'内容宽度', min:520, max:1400,step:20,   def:860,  unit:'px' },
  { key:'--md-para', label:'段间距',   min:0.3, max:2,   step:0.05, def:0.85, unit:'em' },
  { key:'--md-ls',   label:'字间距',   min:0,   max:0.2, step:0.01, def:0,    unit:'em' },
  { key:'--md-dim',  label:'文字亮度', min:0.55,max:1.2, step:0.01, def:1,    unit:'×' },
];
const setRows = $('#setRows');
function buildSettings(){
  setRows.innerHTML = '';
  SETTINGS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'set-row';
    row.innerHTML = `<div class="lab"><span>${s.label}</span><span class="val" id="val${s.key}"></span></div>
      <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.def}" data-key="${s.key}" aria-label="${s.label}">`;
    setRows.appendChild(row);
  });
  setRows.querySelectorAll('input[type=range]').forEach(r => {
    r.addEventListener('input', ()=> applySetting(r.dataset.key, parseFloat(r.value)));
    applySetting(r.dataset.key, parseFloat(r.value));
  });
}
function applySetting(key, val){
  const s = SETTINGS.find(x => x.key === key);
  preview.style.setProperty(key, val + (s.unit === '×' || s.unit === '' ? '' : s.unit));
  const shown = s.unit === '×' ? Math.round(val*100) + '%' : val + s.unit;
  document.getElementById('val' + key).textContent = shown;
}
buildSettings();

function bindChips(containerSel, attr){
  const box = $(containerSel);
  box.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    box.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
    preview.setAttribute('data-' + attr, chip.dataset[attr]);
  });
}
bindChips('#fontChips', 'font');
bindChips('#alignChips', 'align');

$('#resetSet').addEventListener('click', ()=>{
  setRows.querySelectorAll('input[type=range]').forEach(r => {
    const s = SETTINGS.find(x => x.key === r.dataset.key);
    r.value = s.def;
    applySetting(s.key, s.def);
  });
  $('#fontChips .chip[data-font="sans"]').click();
  $('#alignChips .chip[data-align="left"]').click();
  toast('排版已恢复默认');
});

/* ================= 弹出面板开关 ================= */
function bindPop(btnSel, popSel){
  const btn = $(btnSel), pop = $(popSel);
  btn.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.pop.open').forEach(p => { if (p !== pop) p.classList.remove('open'); });
    pop.classList.toggle('open');
    btn.classList.toggle('on', pop.classList.contains('open'));
  });
  document.addEventListener('click', e => {
    if (pop.classList.contains('open') && !pop.contains(e.target) && e.target !== btn){
      pop.classList.remove('open');
      btn.classList.remove('on');
    }
  });
}
bindPop('#setBtn', '#setPop');
bindPop('#expBtn', '#expPop');

/* ================= 编辑器操作 ================= */
function insertAtCursor(text, selectInner){
  const { selectionStart:s } = editor;
  editor.setRangeText(text, s, editor.selectionEnd, 'end');
  if (selectInner){
    editor.selectionStart = s + selectInner[0];
    editor.selectionEnd   = s + selectInner[1];
  }
  editor.focus();
  editor.dispatchEvent(new Event('input'));
}
function wrapSelection(before, after, placeholder){
  const { selectionStart:s, selectionEnd:t } = editor;
  const sel = editor.value.slice(s, t) || placeholder;
  editor.setRangeText(before + sel + after, s, t, 'end');
  editor.selectionStart = s + before.length;
  editor.selectionEnd   = s + before.length + sel.length;
  editor.focus();
  editor.dispatchEvent(new Event('input'));
}
function prefixLines(prefix, placeholder){
  const { selectionStart:s, selectionEnd:t } = editor;
  const sel = editor.value.slice(s, t) || placeholder;
  const out = sel.split('\n').map(l => prefix + l).join('\n');
  editor.setRangeText(out, s, t, 'end');
  editor.focus();
  editor.dispatchEvent(new Event('input'));
}
const ACTIONS = {
  bold:   ()=> wrapSelection('**','**','加粗文字'),
  italic: ()=> wrapSelection('*','*','斜体文字'),
  strike: ()=> wrapSelection('~~','~~','删除文字'),
  h2:     ()=> prefixLines('## ','标题'),
  quote:  ()=> prefixLines('> ','引用内容'),
  ul:     ()=> prefixLines('- ','列表项'),
  code:   ()=> wrapSelection('\n```\n','\n```\n','代码'),
  link:   ()=> wrapSelection('[','](https://)','链接文字'),
  img:    ()=> $('#imgInput').click(),
  table:  ()=> insertAtCursor('\n| 表头 A | 表头 B | 表头 C |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |\n'),
  math:   ()=> wrapSelection('\n$$\n','\n$$\n','E = mc^2'),
};
document.querySelector('.tbar').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (b) ACTIONS[b.dataset.act]();
});
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab'){
    e.preventDefault();
    insertAtCursor('  ');
    return;
  }
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'b'){ e.preventDefault(); ACTIONS.bold(); }
  else if (k === 'i'){ e.preventDefault(); ACTIONS.italic(); }
  else if (k === 'k'){ e.preventDefault(); ACTIONS.link(); }
  else if (k === 's'){ e.preventDefault(); $('#dlMd').click(); }
});

/* ================= 插入图片:选择 / 粘贴 / 拖放 ================= */
function fileToDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = ()=> res(r.result);
    r.onerror = ()=> rej(new Error('读取失败'));
    r.readAsDataURL(file);
  });
}
async function insertImages(files){
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length){ toast('未检测到图片文件'); return; }
  for (const f of imgs){
    if (f.size > 4 * 1024 * 1024) toast(`「${f.name}」超过 4MB,嵌入后文件会较大`);
    const url = await fileToDataURL(f);
    const name = (f.name || 'image').replace(/\.[^.]+$/, '').replace(/[\[\]()]/g, '');
    insertAtCursor(`\n![${name}](${url})\n`);
  }
  toast(`已嵌入 ${imgs.length} 张图片(Base64,随文档一起保存)`);
}
$('#imgInput').addEventListener('change', e => {
  insertImages(e.target.files);
  e.target.value = '';
});
editor.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.items || [])]
    .filter(i => i.kind === 'file' && i.type.startsWith('image/'))
    .map(i => i.getAsFile());
  if (files.length){
    e.preventDefault();
    insertImages(files);
  }
});
editor.addEventListener('dragover', e => { e.preventDefault(); editor.classList.add('dragover'); });
editor.addEventListener('dragleave', ()=> editor.classList.remove('dragover'));
editor.addEventListener('drop', e => {
  editor.classList.remove('dragover');
  if (e.dataTransfer?.files?.length){
    e.preventDefault();
    const fs = [...e.dataTransfer.files];
    const imgFiles = fs.filter(f => f.type.startsWith('image/'));
    const mdFile = fs.find(f => /\.(md|markdown|txt)$/i.test(f.name));
    if (imgFiles.length) insertImages(imgFiles);
    else if (mdFile){
      const r = new FileReader();
      r.onload = ()=>{ editor.value = r.result; render(); toast(`已载入「${mdFile.name}」`); };
      r.readAsText(mdFile);
    }
  }
});

/* ================= 导出 ================= */
function closeExp(){ $('#expPop').classList.remove('open'); $('#expBtn').classList.remove('on'); }
function docTitle(){
  const h = mdRoot.querySelector('h1, h2');
  return (h ? h.textContent.trim() : '星渲文档').slice(0, 40) || '星渲文档';
}
$('#dlMd').addEventListener('click', ()=>{
  download(docTitle() + '.md', editor.value, 'text/markdown;charset=utf-8');
  closeExp(); toast('Markdown 已下载');
});
$('#dlHtml').addEventListener('click', ()=>{
  render();
  const theme = document.documentElement.getAttribute('data-theme');
  const css = document.querySelector('style').textContent;
  const pvStyle = preview.getAttribute('style') || '';
  const html = `<!DOCTYPE html>
<html lang="zh-CN" data-theme="${theme}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${docTitle()}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>${css}
/* 导出页覆写 */
body{display:block; overflow:auto}
#preview{padding:48px 28px 80px; overflow:visible}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="preview" style="${pvStyle.replace(/"/g,'&quot;')}" data-font="${preview.dataset.font}" data-align="${preview.dataset.align}">
<div class="md">${mdRoot.innerHTML}</div>
</div>
<script>
(function(){
  var sky = document.getElementById('sky');
  function stars(){
    if (sky.dataset.built) return; sky.dataset.built = '1';
    for (var i = 0; i < 110; i++){
      var s = document.createElement('div'); s.className = 'star';
      var z = Math.random()*2 + .6;
      s.style.cssText = 'left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;--d:'+(Math.random()*3+2).toFixed(1)+'s;--delay:'+(Math.random()*4).toFixed(1)+'s';
      sky.appendChild(s);
    }
  }
  function meteor(){
    var m = document.createElement('div'); m.className = 'meteor';
    m.style.left = (20+Math.random()*75)+'%'; m.style.top = Math.random()*45+'%';
    m.style.setProperty('--t',(1+Math.random()*.9).toFixed(2)+'s');
    sky.appendChild(m); m.addEventListener('animationend', function(){ m.remove(); });
  }
  function loop(){ setTimeout(function(){ if(document.documentElement.getAttribute('data-theme')==='dark'){ meteor(); } loop(); }, 2500+Math.random()*5000); }
  if (document.documentElement.getAttribute('data-theme')==='dark'){ stars(); if(!matchMedia('(prefers-reduced-motion: reduce)').matches) loop(); }
})();
<\/script>
</body>
</html>`;
  download(docTitle() + '.html', html, 'text/html;charset=utf-8');
  closeExp(); toast('网页已导出(含主题、排版与星空)');
});
$('#doPrint').addEventListener('click', ()=>{
  render();
  closeExp();
  setTimeout(()=> window.print(), 60);
});
async function copyText(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    toast(msg);
  }
}
$('#cpMd').addEventListener('click', ()=>{ copyText(editor.value, '源文已复制'); closeExp(); });
$('#cpHtml').addEventListener('click', ()=>{ render(); copyText(mdRoot.innerHTML, '渲染 HTML 已复制'); closeExp(); });

  const { out, count } = convertMathDelimiters(editor.value);

  editor.value = out;
  render();
  toast(`已转换 ${count} 处数学定界符`);
});

\\[
\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}
\\]
